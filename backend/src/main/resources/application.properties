spring.application.name=owner-tenant-api
spring.config.import=optional:file:.env[.properties],optional:file:./housing-owner-tenant-backend-api/.env[.properties]
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:55432/housing_owner_tenant}
spring.datasource.username=${DB_USER:housing}
spring.datasource.password=${DB_PASSWORD:housing}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.leak-detection-threshold=30000
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
# P4 Cache — Redis L2 (graceful if REDIS_HOST unreachable; set app.cache.enabled=false to disable)
app.cache.enabled=${CACHE_ENABLED:true}
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:56379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=200ms
spring.data.redis.lettuce.pool.max-active=32
spring.data.redis.lettuce.pool.max-idle=16
spring.data.redis.lettuce.pool.min-idle=4
spring.cache.type=redis
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
server.error.include-message=always
# Behind Caddy/Nginx reverse proxy (production HTTPS termination).
# Without these, Spring Boot generates http:// URLs in redirects + Set-Cookie which breaks login on HTTPS.
server.forward-headers-strategy=native
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:3001,http://localhost:3001,http://127.0.0.1:5678,http://localhost:5678,https://frontend.YOUR_VPS_IP.nip.io}
app.auth.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:${GOOGLE_CLIENT_ID:}}
app.auth.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET:}}
app.auth.google.allowed-client-ids=${GOOGLE_OAUTH_ALLOWED_CLIENT_IDS:}
app.auth.google.allowed-redirect-uris=${GOOGLE_OAUTH_ALLOWED_REDIRECT_URIS:http://127.0.0.1:3000/account/login/gmail,http://127.0.0.1:3000/account/register/gmail,http://localhost:3000/account/login/gmail,http://localhost:3000/account/register/gmail,http://127.0.0.1:3001/account/login/gmail,http://127.0.0.1:3001/account/register/gmail,http://localhost:3001/account/login/gmail,http://localhost:3001/account/register/gmail,http://127.0.0.1:5678/account/login/gmail,http://127.0.0.1:5678/account/register/gmail,http://localhost:5678/account/login/gmail,http://localhost:5678/account/register/gmail,http://127.0.0.1:5678/rest/oauth2-credential/callback,http://localhost:5678/rest/oauth2-credential/callback,https://frontend.YOUR_VPS_IP.nip.io/account/login/gmail,https://frontend.YOUR_VPS_IP.nip.io/account/register/gmail,https://frontend.YOUR_VPS_IP.nip.io/rest/oauth2-credential/callback}
app.payments.provider=${PAYMENT_PROVIDER:MOCK}
app.payments.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.payments.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.payments.razorpay.base-url=${RAZORPAY_BASE_URL:https://api.razorpay.com/v1}
# Stripe — Western payment gateway (set PAYMENT_PROVIDER=STRIPE to enable)
app.payments.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.payments.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
app.payments.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
