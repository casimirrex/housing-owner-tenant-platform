name: Restart Hostinger VPS

on:
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest

    steps:
      - name: Restart VPS
        run: |
          response="$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.HOSTINGERAPIKEY }}" \
            -H "Accept: application/json" \
            "https://developers.hostinger.com/api/vps/v1/virtual-machines/1637073/restart")"

          body="$(printf '%s\n' "$response" | sed '$d')"
          status="$(printf '%s\n' "$response" | tail -n1)"

          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "VPS restart initiated successfully."
          else
            echo "VPS restart failed with status $status"
            printf '%s\n' "$body"
            exit 1
          fi
