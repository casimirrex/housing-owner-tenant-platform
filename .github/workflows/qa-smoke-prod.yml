name: QA Smoke (production)

# Lightweight smoke test against the LIVE production site.
# Read-only — only hits the homepage, locale switcher, and search results.
# Never modifies any data. Safe to run every 6 hours and after every deploy.
#
# This is the first thing to check after a deploy. If this fails, the
# heavier QA workflow's results are irrelevant — fix the deploy first.

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours — catches downtime within at most 6h
    - cron: "0 */6 * * *"
  push:
    branches: [main]
    paths:
      - "qa-automation/**"

defaults:
  run:
    working-directory: qa-automation

jobs:
  smoke-prod:
    name: Smoke against https://testition.tech
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      BASE_URL: https://testition.tech
      API_BASE_URL: https://testition.tech
      TENANT_EMAIL: aarav@example.com
      TENANT_PASSWORD: StrongPassword@123

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: qa-automation/package-lock.json

      - name: Install QA deps
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests against production
        run: npx playwright test tests/e2e/smoke/ --project=smoke

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-prod-report
          path: qa-automation/playwright-report/
          retention-days: 14
