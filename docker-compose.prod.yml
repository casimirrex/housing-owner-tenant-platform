services:
  caddy:
    image: caddy:2-alpine
    container_name: housing-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN}
      BACKEND_DOMAIN: ${BACKEND_DOMAIN}
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${BACKEND_DOMAIN}
        API_BASE_URL_INTERNAL: http://backend:8080
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
    container_name: housing-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://${BACKEND_DOMAIN}
      API_BASE_URL_INTERNAL: http://backend:8080
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: housing-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/housing_owner_tenant
      DB_USER: housing
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Production: never re-run schema.sql / data.sql on backend startup.
      # That file DROPs all tables — running it on prod would wipe real user data.
      # Schema changes on prod are applied manually via vps-migrations/*.sql.
      SQL_INIT_MODE: never
      CORS_ALLOWED_ORIGINS: https://${FRONTEND_DOMAIN}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_OAUTH_ALLOWED_CLIENT_IDS: ${GOOGLE_OAUTH_ALLOWED_CLIENT_IDS}
      GOOGLE_OAUTH_ALLOWED_REDIRECT_URIS: ${GOOGLE_OAUTH_ALLOWED_REDIRECT_URIS}
      PREMIUM_WALLET_ACTIVATION_ENABLED: ${PREMIUM_WALLET_ACTIVATION_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: housing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: housing_owner_tenant
      POSTGRES_USER: housing
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housing -d housing_owner_tenant"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: housing-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
