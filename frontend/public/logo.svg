<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Rent Beyond">
  <!-- ─── Gradients & filters for the 3D look ─────────────────────── -->
  <defs>
    <!-- Tile background: deep navy with a soft top-left highlight -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#2A3F73"/>
      <stop offset="55%" stop-color="#1B2A4E"/>
      <stop offset="100%" stop-color="#101A33"/>
    </linearGradient>

    <!-- Inner glow / vignette for depth -->
    <radialGradient id="innerGlow" cx="35%" cy="25%" r="80%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>

    <!-- Cream faces of the house — front face -->
    <linearGradient id="houseFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#FFF8EC"/>
      <stop offset="100%" stop-color="#D9CFB7"/>
    </linearGradient>

    <!-- Cream — the side face, slightly darker for "depth" -->
    <linearGradient id="houseSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#D9CFB7"/>
      <stop offset="100%" stop-color="#A89B7F"/>
    </linearGradient>

    <!-- Roof gradient -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#FFFCF2"/>
      <stop offset="100%" stop-color="#C9BFA5"/>
    </linearGradient>

    <!-- Gold star gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#FFE08A"/>
      <stop offset="55%" stop-color="#D4A857"/>
      <stop offset="100%" stop-color="#9C7A2D"/>
    </linearGradient>

    <!-- Gold key gradient -->
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#FFE08A"/>
      <stop offset="100%" stop-color="#B58A3E"/>
    </linearGradient>

    <!-- Drop shadow under the house -->
    <filter id="houseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Star glow -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="blurred"/>
      <feMerge>
        <feMergeNode in="blurred"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ─── Tile background ─────────────────────────────────────────── -->
  <rect x="0" y="0" width="128" height="128" rx="26" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="128" height="128" rx="26" fill="url(#innerGlow)"/>

  <!-- Subtle top highlight stroke for "glass" feel -->
  <rect x="1.5" y="1.5" width="125" height="125" rx="25" fill="none"
        stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- ─── Floor shadow ellipse under the house ───────────────────── -->
  <ellipse cx="64" cy="106" rx="32" ry="4" fill="#000000" opacity="0.35"/>

  <!-- ─── House: side face first (back layer) ────────────────────── -->
  <g filter="url(#houseShadow)">
    <!-- Right side face (the "depth" face). A skewed quad gives 2.5D feel. -->
    <path d="M82 102 L92 92 L92 64 L82 74 Z" fill="url(#houseSide)"/>
    <!-- Right roof slope -->
    <path d="M64 46 L92 64 L82 74 L64 60 Z" fill="#9C8F6F"/>

    <!-- Front face -->
    <path d="M36 74 L82 74 L82 102 L36 102 Z" fill="url(#houseFront)"/>
    <!-- Front roof -->
    <path d="M30 70 L64 46 L82 74 L36 74 Z" fill="url(#roofGrad)"/>

    <!-- Door (recessed feeling via dark navy + small highlight) -->
    <path d="M55 102 L55 88 Q59 84 64 84 Q69 84 69 88 L69 102 Z" fill="#1B2A4E"/>
    <rect x="55" y="86" width="14" height="2" fill="#101A33"/>
    <!-- Door knob -->
    <circle cx="66" cy="94" r="1.4" fill="#D4A857"/>

    <!-- Left window (frame + dark glass + cross) -->
    <rect x="40" y="80" width="10" height="9" rx="0.8" fill="#1B2A4E"/>
    <line x1="45" y1="80" x2="45" y2="89" stroke="#FFF8EC" stroke-width="0.6"/>
    <line x1="40" y1="84.5" x2="50" y2="84.5" stroke="#FFF8EC" stroke-width="0.6"/>

    <!-- Right window -->
    <rect x="73" y="80" width="6.5" height="9" rx="0.8" fill="#1B2A4E"/>
    <line x1="76.25" y1="80" x2="76.25" y2="89" stroke="#FFF8EC" stroke-width="0.6"/>
    <line x1="73" y1="84.5" x2="79.5" y2="84.5" stroke="#FFF8EC" stroke-width="0.6"/>
  </g>

  <!-- ─── Trust-star (top-left, with glow) ───────────────────────── -->
  <g filter="url(#starGlow)">
    <path d="M32 24
             l3.2 7.2 l7.8 0.8
             l-5.6 5.2 l1.6 7.6
             l-7 -3.6 l-7 3.6
             l1.6 -7.6 l-5.6 -5.2
             l7.8 -0.8 z"
          fill="url(#starGrad)"/>
    <!-- Specular highlight -->
    <path d="M30.5 25.5 l2 4.5 l-3 -1.5 z" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- ─── Key (top-right) ────────────────────────────────────────── -->
  <g transform="translate(94 26) rotate(35)" filter="url(#starGlow)">
    <!-- Ring -->
    <circle cx="0" cy="0" r="5.2" fill="none" stroke="url(#keyGrad)" stroke-width="2.4"/>
    <!-- Shaft -->
    <rect x="4.5" y="-1.2" width="13" height="2.4" fill="url(#keyGrad)"/>
    <!-- Teeth -->
    <rect x="14" y="1.2" width="2.4" height="3.6" fill="url(#keyGrad)"/>
    <rect x="17" y="1.2" width="2.4" height="2.6" fill="url(#keyGrad)"/>
    <!-- Highlight on ring -->
    <path d="M -3.5 -3.5 q 3 -2 6 0" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
